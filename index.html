<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#061A3A"
    >

    <meta
        name="description"
        content="Sherlyn Chong — Key Account Executive, Saint-Gobain Weber & Tekbond"
    >

    <!-- Share / Link Preview -->
    <meta
        property="og:title"
        content="Sherlyn Chong"
    >

    <meta
        property="og:description"
        content="Key Account Executive | Saint-Gobain Weber & Tekbond"
    >

    <meta
        property="og:image"
        content="https://torryweber.github.io/sherlyn-business-card/share-contact.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sherlyn-business-card/"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Sherlyn Chong"
    >

    <meta
        name="twitter:description"
        content="Key Account Executive | Saint-Gobain Weber & Tekbond"
    >

    <meta
        name="twitter:image"
        content="https://torryweber.github.io/sherlyn-business-card/share-contact.png"
    >

    <title>
        Sherlyn Chong | Weber
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background-glow glow-yellow"></div>

    <div class="background-glow glow-blue"></div>


    <!-- =====================================
         MAIN CARD
    ====================================== -->

    <main class="card">


        <!-- =================================
             WEBER LOGO
        ================================== -->

        <div class="logo-container">

            <img
                src="weber-logo.png"
                alt="Saint-Gobain Weber"
                class="weber-logo"
            >

        </div>


        <!-- =================================
             PROFILE
        ================================== -->

        <section class="profile">

            <div class="profile-ring">

                <img
                    src="sherlyn.jpg"
                    alt="Sherlyn Chong"
                    class="profile-photo"
                >

            </div>


            <h1>
                Sherlyn Chong
            </h1>


            <div class="position">
                Key Account Executive
            </div>


            <div class="company">
                Saint-Gobain Weber &amp; Tekbond
            </div>

        </section>


        <!-- =================================
             SAVE CONTACT
        ================================== -->

        <button
            type="button"
            class="action-button save-button"
            id="saveContact"
        >

            <span class="icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="9"
                        cy="8"
                        r="3.2"
                    ></circle>

                    <path
                        d="M3.8 20c.4-3.2 2.4-5.2 5.2-5.2s4.8 2 5.2 5.2"
                    ></path>

                    <path
                        d="M18 8v6"
                    ></path>

                    <path
                        d="M15 11h6"
                    ></path>

                </svg>

            </span>


            <span class="button-label">
                Save Contact
            </span>


            <span class="arrow">
                ›
            </span>

        </button>


        <!-- =================================
             CALL / WHATSAPP / EMAIL
        ================================== -->

        <div class="contact-row">


            <!-- CALL -->

            <a
                href="tel:+60122815972"
                class="quick-action"
                aria-label="Call Sherlyn"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1.5 1.5 0 0 1 1.6-.35l3.1 1.25a1.5 1.5 0 0 1 .95 1.4V20a1.5 1.5 0 0 1-1.65 1.5C10.5 20.7 3.3 13.5 2.5 4.65A1.5 1.5 0 0 1 4 3h2.5a1.5 1.5 0 0 1 1.4.95l1.25 3.1a1.5 1.5 0 0 1-.35 1.6Z"
                        ></path>

                    </svg>

                </div>


                <span>
                    Call
                </span>

            </a>


            <!-- WHATSAPP -->

            <a
                href="https://wa.me/60122815972"
                class="quick-action"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="WhatsApp Sherlyn"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M20.5 3.5A11 11 0 0 0 3.2 17.1L2 22l5-1.3A11 11 0 1 0 20.5 3.5Z"
                        ></path>

                        <path
                            d="M8.2 7.5c.3-.7.6-.7 1-.7h.7c.2 0 .4.1.5.4l.9 2.1c.1.2.1.5-.1.7l-.7.8c.5 1 1.3 1.8 2.3 2.3l.8-.7c.2-.2.5-.2.7-.1l2.1.9c.3.1.4.3.4.5-.1 1.2-.7.9-1.1 1.1-.3.1-.6 0-.9-.1-1.1-.4-2.2-1.2-3.2-2.2-1-.9-1.7-2-2.1-3.1-.2-.5-.2-1-.1-1.4.1-.2.2-.4.3-.6Z"
                        ></path>

                    </svg>

                </div>


                <span>
                    WhatsApp
                </span>

            </a>


            <!-- EMAIL -->

            <a
                href="mailto:Sherlyn.CHONG@saint-gobain.com"
                class="quick-action"
                aria-label="Email Sherlyn"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <path
                            d="m4 7 8 6 8-6"
                        ></path>

                    </svg>

                </div>


                <span>
                    Email
                </span>

            </a>

        </div>


        <!-- =================================
             FACTORY
        ================================== -->

        <a
            href="https://maps.app.goo.gl/sUvoEyH1seHjzpY28?g_st=ic"
            target="_blank"
            rel="noopener noreferrer"
            class="wide-button"
        >

            <div class="wide-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
                    ></path>

                    <circle
                        cx="12"
                        cy="9"
                        r="2.5"
                    ></circle>

                </svg>

            </div>


            <div class="wide-text">

                <small>
                    LOCATION
                </small>

                <strong>
                    Weber Factory
                </strong>

            </div>


            <span class="wide-arrow">
                ›
            </span>

        </a>


        <!-- =================================
             WEBSITE
        ================================== -->

        <a
            href="https://www.saint-gobain.my"
            target="_blank"
            rel="noopener noreferrer"
            class="wide-button"
        >

            <div class="wide-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                    ></circle>

                    <path
                        d="M3 12h18"
                    ></path>

                    <path
                        d="M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9"
                    ></path>

                    <path
                        d="M12 3c-2.5 2.5-3.5 5.5-3.5 9s1 6.5 3.5 9"
                    ></path>

                </svg>

            </div>


            <div class="wide-text">

                <small>
                    WEBSITE
                </small>

                <strong>
                    Saint-Gobain Malaysia
                </strong>

            </div>


            <span class="wide-arrow">
                ›
            </span>

        </a>


        <!-- =================================
             SHARE CONTACT
        ================================== -->

        <button
            type="button"
            class="share-button"
            id="shareCard"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M12 16V3"
                ></path>

                <path
                    d="m7 8 5-5 5 5"
                ></path>

                <path
                    d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"
                ></path>

            </svg>


            <span>
                Share Contact
            </span>

        </button>


        <!-- =================================
             FOOTER
        ================================== -->

        <div class="footer">
            DIGITAL BUSINESS CARD
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
