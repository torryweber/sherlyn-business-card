<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#061A3A"
    >

    <meta
        name="description"
        content="Sherlyn Chong — Key Account Executive, Saint-Gobain Weber & Tekbond"
    >

    <!-- =====================================
         SHARE PREVIEW
    ====================================== -->

    <meta
        property="og:title"
        content="Sherlyn Chong"
    >

    <meta
        property="og:description"
        content="Key Account Executive | Saint-Gobain Weber & Tekbond"
    >

    <meta
        property="og:image"
        content="https://torryweber.github.io/sherlyn-business-card/share-preview.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sherlyn-business-card/"
    >

    <meta
        property="og:type"
        content="website"
    >


    <!-- =====================================
         TWITTER SHARE PREVIEW
    ====================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Sherlyn Chong"
    >

    <meta
        name="twitter:description"
        content="Key Account Executive | Saint-Gobain Weber & Tekbond"
    >

    <meta
        name="twitter:image"
        content="https://torryweber.github.io/sherlyn-business-card/share-preview.png"
    >


    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon-32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="favicon-16.png"
    >


    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="apple-touch-icon.png"
    >


    <!-- =====================================
         IOS
    ====================================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Sherlyn Chong"
    >


    <title>
        Sherlyn Chong | Weber
    </title>


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="background-glow glow-yellow"></div>

    <div class="background-glow glow-blue"></div>


    <!-- =====================================
         MAIN CARD
    ====================================== -->

    <main class="card">


        <!-- =================================
             WEBER LOGO
        ================================== -->

        <div class="logo-container">

            <img
                src="weber-logo.png"
                alt="Saint-Gobain Weber"
                class="weber-logo"
            >

        </div>


        <!-- =================================
             PROFILE
        ================================== -->

        <section class="profile">

            <div class="profile-ring">

                <img
                    src="sherlyn.jpg"
                    alt="Sherlyn Chong"
                    class="profile-photo"
                >

            </div>


            <h1>
                Sherlyn Chong
            </h1>


            <div class="position">
                Key Account Executive
            </div>


            <div class="company">
                Saint-Gobain Weber &amp; Tekbond
            </div>

        </section>


        <!-- =================================
             SAVE CONTACT
        ================================== -->

        <button
            type="button"
            class="action-button save-button"
            id="saveContact"
            aria-label="Save Sherlyn Chong contact"
        >

            <span class="icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="9"
                        cy="8"
                        r="3.2"
                    ></circle>

                    <path
                        d="M3.8 20c.4-3.2 2.4-5.2 5.2-5.2s4.8 2 5.2 5.2"
                    ></path>

                    <path
                        d="M18 8v6"
                    ></path>

                    <path
                        d="M15 11h6"
                    ></path>

                </svg>

            </span>


            <span class="button-label">
                Save Contact
            </span>


            <span class="arrow">
                ›
            </span>

        </button>


        <!-- =================================
             CALL / WHATSAPP / EMAIL
        ================================== -->

        <div class="contact-row">


            <!-- =================================
                 CALL
            ================================== -->

            <a
                href="tel:+60122815972"
                class="quick-action"
                aria-label="Call Sherlyn Chong"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1.5 1.5 0 0 1 1.6-.35l3.1 1.25a1.5 1.5 0 0 1 .95 1.4V20a1.5 1.5 0 0 1-1.65 1.5C10.5 20.7 3.3 13.5 2.5 4.65A1.5 1.5 0 0 1 4 3h2.5a1.5 1.5 0 0 1 1.4.95l1.25 3.1a1.5 1.5 0 0 1-.35 1.6Z"
                        ></path>

                    </svg>

                </div>

                <span>
                    Call
                </span>

            </a>


            <!-- =================================
                 WHATSAPP
            ================================== -->

            <a
                href="https://wa.me/60122815972"
                class="quick-action whatsapp-action"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="WhatsApp Sherlyn Chong"
            >

                <div class="quick-icon whatsapp-icon">

                    <!-- SOLID WHATSAPP BRAND LOGO -->

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.248-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413A11.815 11.815 0 0012.05 0Z"
                            fill="currentColor"
                        ></path>

                    </svg>

                </div>

                <span>
                    WhatsApp
                </span>

            </a>


            <!-- =================================
                 EMAIL
            ================================== -->

            <a
                href="mailto:Sherlyn.CHONG@saint-gobain.com"
                class="quick-action"
                aria-label="Email Sherlyn Chong"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <path
                            d="m4 7 8 6 8-6"
                        ></path>

                    </svg>

                </div>

                <span>
                    Email
                </span>

            </a>


        </div>


        <!-- =================================
             WEBER FACTORY
        ================================== -->

        <a
            href="https://maps.app.goo.gl/sUvoEyH1seHjzpY28?g_st=ic"
            target="_blank"
            rel="noopener noreferrer"
            class="wide-button"
            aria-label="Open Weber Factory in Google Maps"
        >

            <div class="wide-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
                    ></path>

                    <circle
                        cx="12"
                        cy="9"
                        r="2.5"
                    ></circle>

                </svg>

            </div>


            <div class="wide-text">

                <small>
                    LOCATION
                </small>

                <strong>
                    Weber Factory
                </strong>

            </div>


            <span class="wide-arrow">
                ›
            </span>

        </a>


        <!-- =================================
             SAINT-GOBAIN WEBSITE
        ================================== -->

        <a
            href="https://www.saint-gobain.my"
            target="_blank"
            rel="noopener noreferrer"
            class="wide-button"
            aria-label="Visit Saint-Gobain Malaysia website"
        >

            <div class="wide-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                    ></circle>

                    <path
                        d="M3 12h18"
                    ></path>

                    <path
                        d="M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9"
                    ></path>

                    <path
                        d="M12 3c-2.5 2.5-3.5 5.5-3.5 9s1 6.5 3.5 9"
                    ></path>

                </svg>

            </div>


            <div class="wide-text">

                <small>
                    WEBSITE
                </small>

                <strong>
                    Saint-Gobain Malaysia
                </strong>

            </div>


            <span class="wide-arrow">
                ›
            </span>

        </a>


        <!-- =================================
             SHARE CONTACT
        ================================== -->

        <button
            type="button"
            class="share-button"
            id="shareCard"
            aria-label="Share Sherlyn Chong contact"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M12 16V3"
                ></path>

                <path
                    d="m7 8 5-5 5 5"
                ></path>

                <path
                    d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"
                ></path>

            </svg>

            <span>
                Share Contact
            </span>

        </button>


        <!-- =================================
             FOOTER
        ================================== -->

        <div class="footer">
            DIGITAL BUSINESS CARD
        </div>


    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>

</body>

</html>
