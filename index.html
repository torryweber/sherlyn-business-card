<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#061A3A"
    >

    <meta
        name="description"
        content="Sherlyn Chong — Key Account Executive, Saint-Gobain Weber & Tekbond"
    >


    <!-- =====================================
         WEBSITE SHARE PREVIEW
    ====================================== -->

    <meta
        property="og:title"
        content="Sherlyn Chong"
    >

    <meta
        property="og:description"
        content="Key Account Executive | Saint-Gobain Weber & Tekbond"
    >

    <meta
        property="og:image"
        content="https://torryweber.github.io/sherlyn-business-card/share-preview.png"
    >

    <meta
        property="og:url"
        content="https://torryweber.github.io/sherlyn-business-card/"
    >

    <meta
        property="og:type"
        content="website"
    >


    <!-- =====================================
         SOCIAL PREVIEW
    ====================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="Sherlyn Chong"
    >

    <meta
        name="twitter:description"
        content="Key Account Executive | Saint-Gobain Weber & Tekbond"
    >

    <meta
        name="twitter:image"
        content="https://torryweber.github.io/sherlyn-business-card/share-preview.png"
    >


    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="favicon-32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="favicon-16.png"
    >


    <!-- =====================================
         APPLE ICON
    ====================================== -->

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="apple-touch-icon.png"
    >


    <!-- =====================================
         IOS PWA
    ====================================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Sherlyn Chong"
    >


    <title>
        Sherlyn Chong | Weber
    </title>


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div
        class="background-glow glow-yellow"
    ></div>

    <div
        class="background-glow glow-blue"
    ></div>


    <!-- =====================================
         MAIN CARD
    ====================================== -->

    <main class="card">


        <!-- =================================
             WEBER LOGO
        ================================== -->

        <div class="logo-container">

            <img
                src="weber-logo.png"
                alt="Saint-Gobain Weber"
                class="weber-logo"
            >

        </div>


        <!-- =================================
             PROFILE
        ================================== -->

        <section class="profile">


            <div class="profile-ring">

                <img
                    src="sherlyn.jpg"
                    alt="Sherlyn Chong"
                    class="profile-photo"
                >

            </div>


            <h1>
                Sherlyn Chong
            </h1>


            <div class="position">
                Key Account Executive
            </div>


            <div class="company">
                Saint-Gobain Weber &amp; Tekbond
            </div>


        </section>


        <!-- =================================
             SAVE CONTACT
        ================================== -->

        <button
            type="button"
            class="action-button save-button"
            id="saveContact"
            aria-label="Save Sherlyn Chong contact"
        >

            <span class="icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="9"
                        cy="8"
                        r="3.2"
                    ></circle>

                    <path
                        d="M3.8 20c.4-3.2 2.4-5.2 5.2-5.2s4.8 2 5.2 5.2"
                    ></path>

                    <path
                        d="M18 8v6"
                    ></path>

                    <path
                        d="M15 11h6"
                    ></path>

                </svg>

            </span>


            <span class="button-label">
                Save Contact
            </span>


            <span class="arrow">
                ›
            </span>

        </button>


        <!-- =================================
             CALL / WHATSAPP / EMAIL
        ================================== -->

        <div class="contact-row">


            <!-- =================================
                 CALL
            ================================== -->

            <a
                href="tel:+60122815972"
                class="quick-action"
                aria-label="Call Sherlyn Chong"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1.5 1.5 0 0 1 1.6-.35l3.1 1.25a1.5 1.5 0 0 1 .95 1.4V20a1.5 1.5 0 0 1-1.65 1.5C10.5 20.7 3.3 13.5 2.5 4.65A1.5 1.5 0 0 1 4 3h2.5a1.5 1.5 0 0 1 1.4.95l1.25 3.1a1.5 1.5 0 0 1-.35 1.6Z"
                        ></path>

                    </svg>

                </div>

                <span>
                    Call
                </span>

            </a>


            <!-- =================================
                 WHATSAPP
            ================================== -->

            <a
                href="https://wa.me/60122815972"
                class="quick-action whatsapp-action"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="WhatsApp Sherlyn Chong"
            >

                <div class="quick-icon whatsapp-icon">

                    <!-- WhatsApp-style logo -->

                    <svg
                        viewBox="0 0 32 32"
                        aria-hidden="true"
                    >

                        <!-- Outer WhatsApp speech circle -->

                        <path
                            class="whatsapp-circle"
                            d="
                                M16 3.2
                                C8.93 3.2 3.2 8.93 3.2 16
                                C3.2 18.35 3.84 20.55 4.95 22.45
                                L3.25 28.8
                                L9.75 27.1
                                C11.58 28.18 13.72 28.8 16 28.8
                                C23.07 28.8 28.8 23.07 28.8 16
                                C28.8 8.93 23.07 3.2 16 3.2
                                Z
                            "
                        ></path>


                        <!-- WhatsApp handset -->

                        <path
                            class="whatsapp-phone"
                            d="
                                M10.4 9.1
                                C10.05 9.1 9.72 9.3 9.57 9.62
                                L8.82 11.28
                                C8.63 11.7 8.69 12.19 8.98 12.54

                                C10.55 14.53
                                C12.1 16.08 13.65 17.63 15.64 19.02

                                C16 19.27 16.47 19.31 16.87 19.13
                                L18.52 18.38

                                C18.86 18.22 19.07 17.88 19.07 17.51
                                L19.07 16.57

                                C19.07 16.2 19.3 15.87 19.65 15.75
                                L20.85 15.34

                                C21.29 15.19 21.77 15.38 21.98 15.79

                                L22.63 17.05

                                C22.84 17.46 22.76 17.96 22.43 18.29

                                L21.62 19.1

                                C21.05 19.67 20.22 19.9 19.44 19.69

                                C16.83 18.98 14.23 17.38 12.08 15.23

                                C9.93 13.08 8.33 10.48 7.62 7.87

                                C7.41 7.09 7.64 6.26 8.21 5.69

                                L9.02 4.88

                                C9.35 4.55 9.85 4.47 10.26 4.68

                                L11.52 5.33

                                C11.93 5.54 12.12 6.02 11.97 6.46

                                L11.56 7.66

                                C11.44 8.01 11.11 8.24 10.74 8.24

                                L9.85 8.24
                            "
                        ></path>

                    </svg>

                </div>

                <span>
                    WhatsApp
                </span>

            </a>


            <!-- =================================
                 EMAIL
            ================================== -->

            <a
                href="mailto:Sherlyn.CHONG@saint-gobain.com"
                class="quick-action"
                aria-label="Email Sherlyn Chong"
            >

                <div class="quick-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <path
                            d="m4 7 8 6 8-6"
                        ></path>

                    </svg>

                </div>

                <span>
                    Email
                </span>

            </a>


        </div>


        <!-- =================================
             WEBER FACTORY
        ================================== -->

        <a
            href="https://maps.app.goo.gl/sUvoEyH1seHjzpY28?g_st=ic"
            target="_blank"
            rel="noopener noreferrer"
            class="wide-button"
            aria-label="Open Weber Factory in Google Maps"
        >

            <div class="wide-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
                    ></path>

                    <circle
                        cx="12"
                        cy="9"
                        r="2.5"
                    ></circle>

                </svg>

            </div>


            <div class="wide-text">

                <small>
                    LOCATION
                </small>

                <strong>
                    Weber Factory
                </strong>

            </div>


            <span class="wide-arrow">
                ›
            </span>

        </a>


        <!-- =================================
             SAINT-GOBAIN WEBSITE
        ================================== -->

        <a
            href="https://www.saint-gobain.my"
            target="_blank"
            rel="noopener noreferrer"
            class="wide-button"
            aria-label="Visit Saint-Gobain Malaysia website"
        >

            <div class="wide-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="9"
                    ></circle>

                    <path
                        d="M3 12h18"
                    ></path>

                    <path
                        d="M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9"
                    ></path>

                    <path
                        d="M12 3c-2.5 2.5-3.5 5.5-3.5 9s1 6.5 3.5 9"
                    ></path>

                </svg>

            </div>


            <div class="wide-text">

                <small>
                    WEBSITE
                </small>

                <strong>
                    Saint-Gobain Malaysia
                </strong>

            </div>


            <span class="wide-arrow">
                ›
            </span>

        </a>


        <!-- =================================
             SHARE CONTACT
        ================================== -->

        <button
            type="button"
            class="share-button"
            id="shareCard"
            aria-label="Share Sherlyn Chong contact"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M12 16V3"
                ></path>

                <path
                    d="m7 8 5-5 5 5"
                ></path>

                <path
                    d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"
                ></path>

            </svg>


            <span>
                Share Contact
            </span>

        </button>


        <!-- =================================
             FOOTER
        ================================== -->

        <div class="footer">
            DIGITAL BUSINESS CARD
        </div>


    </main>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
